function useIsMobile() {
  const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return isMobile;
}

function Calculator({ t, onQuoteChange, onSelChange }) {
  const isMobile = useIsMobile();
  const [sel, setSel] = useState({ pkg: "arch", flowers: "no", numbers: "no", location: "local" });
  const prices = { pkg: { arch: 150, hoop: 200, asymmetrical: 150 }, flowers: { no: 0, yes: 40 }, numbers: { no: 0, one: 15, two: 25 }, location: { local: 0, near: 15, mid: 25, far: 40 } };
  const total = Object.keys(sel).reduce((sum, k) => sum + (prices[k][sel[k]] || 0), 0);
  useEffect(() => { onQuoteChange && onQuoteChange(total); onSelChange && onSelChange(sel); }, [total, JSON.stringify(sel)]);

  const Option = ({ group, value, label, sublabel, children }) => {
    const active = sel[group] === value;
    return (
      <div onClick={() => setSel((s) => ({ ...s, [group]: value }))} style={{ border: active ? `2px solid ${t.accent1}` : t.cardBorder || `2px solid rgba(0,0,0,0.1)`, borderRadius: t.cardRadius, padding: "16px 14px", cursor: "pointer", background: active ? `${t.accent1}18` : "white", transition: "all 0.2s", display: "flex", flexDirection: "column", gap: 4 }}>
        <span style={{ fontFamily: t.body, fontSize: 14, fontWeight: 600, color: t.fg }}>{label}</span>
        <span style={{ fontFamily: t.body, fontSize: 12, color: active ? t.accent1 : t.fg, opacity: active ? 1 : 0.5, fontWeight: 600 }}>{sublabel}</span>
      </div>);

  };

  return (
    <section id="pricing" style={{ background: t.calcBg, padding: isMobile ? "64px 20px" : "96px 64px" }}>
      <div style={{ maxWidth: 860, margin: "0 auto" }}>
        <p style={{ fontFamily: t.body, fontSize: 12, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", color: t.calcFg, opacity: 0.6, marginBottom: 16 }}>Instant Estimate</p>
        <h2 style={{ fontFamily: t.font, fontSize: "clamp(36px, 5vw, 64px)", fontWeight: 800, color: t.calcFg, marginBottom: 8, lineHeight: 1.0, letterSpacing: "-1px" }}>How much<br />will it cost?</h2>
        <p style={{ fontFamily: t.body, fontSize: 16, color: t.calcFg, opacity: 0.6, marginBottom: 56 }}>Pick your options below — no commitment, just a starting point!</p>

        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: isMobile ? 32 : 48 }}>
          <div>
            {/* Package */}
            <div style={{ marginBottom: 32 }}>
              <p style={{ fontFamily: t.body, fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: t.calcFg, opacity: 0.55, marginBottom: 12 }}>1. What do you need?</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                <Option group="pkg" value="arch" label="Arch" sublabel="from €150" />
                <Option group="pkg" value="hoop" label="Hoop Arch" sublabel="from €200" />
                <Option group="pkg" value="asymmetrical" label="Asymmetrical Arch" sublabel="from €150" />
              </div>
            </div>

            {/* Flowers */}
            <div style={{ marginBottom: 32 }}>
              <p style={{ fontFamily: t.body, fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: t.calcFg, opacity: 0.55, marginBottom: 12 }}>2. Add flowers?</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Option group="flowers" value="no" label="Just balloons" sublabel="+€0" />
                <Option group="flowers" value="yes" label="Yes please!" sublabel="+€40" />
              </div>
            </div>

            {/* Numbers */}
            <div style={{ marginBottom: 32 }}>
              <p style={{ fontFamily: t.body, fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: t.calcFg, opacity: 0.55, marginBottom: 12 }}>3. Number balloons?</p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
                <Option group="numbers" value="no" label="None" sublabel="+€0" />
                <Option group="numbers" value="one" label="1 balloon" sublabel="+€15" />
                <Option group="numbers" value="two" label="2 balloons" sublabel="+€25" />
              </div>
            </div>

            {/* Location */}
            <div>
              <p style={{ fontFamily: t.body, fontSize: 12, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: t.calcFg, opacity: 0.55, marginBottom: 12 }}>4. Location? (based in Quarteira)</p>

}

function Booking({ t, quote, calcSel }) {
  const selLabels = {
    pkg: { arch: "Arch", hoop: "Hoop Arch", asymmetrical: "Asymmetrical Arch" },
    flowers: { no: "No flowers", yes: "Yes, add flowers" },
    numbers: { no: "No number balloons", one: "1 number balloon", two: "2 number balloons" },
    location: { local: "Quarteira / Vilamoura (free delivery)", near: "Loulé / Faro / Olhão (+€15)", mid: "Albufeira / Silves (+€25)", far: "Lagos / Portimão (+€40)" },
  };
  const formatSel = (s) => s ? [
    "Style: " + (selLabels.pkg[s.pkg] || s.pkg),
    "Flowers: " + (selLabels.flowers[s.flowers] || s.flowers),
    "Numbers: " + (selLabels.numbers[s.numbers] || s.numbers),
    "Location: " + (selLabels.location[s.location] || s.location),
  ].join(" | ") : "";
  const [form, setForm] = useState({ name: "", email: "", phone: "", date: "", eventType: "Birthday Party", message: "" });
  const [status, setStatus] = useState("idle");
  const inputStyle = { width: "100%", padding: "14px 16px", border: `1px solid ${t.fg}20`, borderRadius: t.name === "Dreamy" ? 12 : t.name === "Graphic" ? 0 : 6, fontFamily: t.body, fontSize: 15, color: t.fg, background: "transparent", outline: "none" };
  const labelStyle = { fontFamily: t.body, fontSize: 11, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", color: t.fg, opacity: 0.5, display: "block", marginBottom: 8 };

  const handleChange = (e) => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

  const handleSubmit = (e) => {
    e.preventDefault();
    setStatus("sending");
    fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        access_key: "4b81fe93-4e1c-41d5-ad07-0349351ad22a",
        subject: "🎈 New Booking Request from " + form.name,
        from_name: "Balloons by Shir Website",
        name: form.name,
        email: form.email,
        phone: form.phone,
        event_date: form.date,
        event_type: form.eventType,
        message: form.message,
        quote_estimate: "€" + quote + " (calculator estimate)",
        calculator_selections: formatSel(calcSel),
      }),
    })
    .then(function(res) { return res.json(); })
    .then(function(data) { setStatus(data.success ? "success" : "error"); })
    .catch(function() { setStatus("error"); });
  };

  const isMobile = useIsMobile();

  if (status === "success") return (
    <section id="booking" style={{ background: t.sectionBg2, padding: isMobile ? "64px 20px" : "96px 64px" }}>
      <div style={{ maxWidth: 640, margin: "0 auto", textAlign: "center" }}>
        <div style={{ fontSize: 64, marginBottom: 24 }}>🎈</div>
        <h2 style={{ fontFamily: t.font, fontSize: 48, fontWeight: 800, color: t.sectionFg2, marginBottom: 16 }}>Request Sent!</h2>
        <p style={{ fontFamily: t.body, fontSize: 18, color: t.sectionFg2, opacity: 0.6 }}>Shir will get back to you within 24 hours.</p>
      </div>
    </section>);

  return (
    <section id="booking" style={{ background: t.sectionBg2, padding: isMobile ? "64px 20px" : "96px 64px" }}>
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <p style={{ fontFamily: t.body, fontSize: 12, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", color: t.accent1, marginBottom: 16 }}>Get In Touch</p>
        <h2 style={{ fontFamily: t.font, fontSize: "clamp(36px, 4vw, 56px)", fontWeight: 800, color: t.sectionFg2, marginBottom: 12, lineHeight: 1.1 }}>Let's make your<br /><span style={{ color: t.accent1 }}>event beautiful.</span></h2>
        <p style={{ fontFamily: t.body, fontSize: 16, color: t.sectionFg2, opacity: 0.55, marginBottom: 48, lineHeight: 1.7 }}>Fill in the form and I'll get back to you within 24 hours with a custom quote.</p>

        <div style={{ background: t.bg, borderRadius: t.name === "Dreamy" ? 24 : 12, padding: isMobile ? 20 : 48 }}>
          {quote > 0 && (
            <div style={{ background: `${t.accent1}15`, border: `1px solid ${t.accent1}40`, borderRadius: 8, padding: "12px 16px", marginBottom: 24, display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontFamily: t.body, fontSize: 13, color: t.fg, opacity: 0.7 }}>Your calculator estimate:</span>
              <span style={{ fontFamily: t.font, fontSize: 22, fontWeight: 800, color: t.accent1 }}>€{quote}</span>
            </div>
          )}
          <form onSubmit={handleSubmit}>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 16, marginBottom: 16 }}>
              <div>
                <label style={labelStyle}>Your Name</label>
                <input required name="name" type="text" placeholder="Sarah" value={form.name} onChange={handleChange} style={inputStyle} />
              </div>
              <div>
                <label style={labelStyle}>Email</label>
                <input required name="email" type="email" placeholder="sarah@email.com" value={form.email} onChange={handleChange} style={inputStyle} />
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 16, marginBottom: 16 }}>
              <div>
                <label style={labelStyle}>WhatsApp / Phone</label>
                <input required name="phone" type="tel" placeholder="+351 ..." value={form.phone} onChange={handleChange} style={inputStyle} />
              </div>
              <div>
                <label style={labelStyle}>Event Date</label>
                <input name="date" type="date" value={form.date} onChange={handleChange} style={inputStyle} />
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={labelStyle}>Event Type</label>
              <select name="eventType" value={form.eventType} onChange={handleChange} style={inputStyle}>
                <option>Birthday Party</option>
                <option>Bat / Bar Mitzvah</option>
                <option>Baby Shower</option>
                <option>Wedding / Engagement</option>
                <option>Other</option>
              </select>
            </div>
            <div style={{ marginBottom: 24 }}>
              <label style={labelStyle}>Tell me about your vision</label>
              <textarea name="message" placeholder="Colours, theme, venue, anything helps!" value={form.message} onChange={handleChange} style={{ ...inputStyle, height: 100, resize: "vertical" }} />
            </div>
            <button type="submit" disabled={status === "sending"} style={{ width: "100%", background: t.accent1, color: t.name === "Dreamy" ? "#2D1B4E" : t.name === "Graphic" ? "#1C1B18" : "#FFFFFF", padding: "18px", border: "none", borderRadius: t.btnRadius, fontFamily: t.body, fontSize: 16, fontWeight: 700, cursor: status === "sending" ? "not-allowed" : "pointer", opacity: status === "sending" ? 0.7 : 1 }}>
              {status === "sending" ? "Sending..." : "Send My Request"}
            </button>
            {status === "error" && <p style={{ fontFamily: t.body, fontSize: 14, color: "#e53e3e", textAlign: "center", marginTop: 12 }}>Something went wrong. Please try again or WhatsApp Shir directly.</p>}
          </form>
        </div>
      </div>
    </section>);

}

  const isMobile = useIsMobile();
  return (
    <footer style={{ background: t.footerBg, padding: isMobile ? "24px 20px" : "32px 64px", display: "flex", flexDirection: isMobile ? "column" : "row", justifyContent: "space-between", alignItems: "center", gap: isMobile ? 8 : 0 }}>
      <span style={{ fontFamily: t.font, fontSize: 20, fontWeight: 800, color: t.footerFg }}>
        Balloons <span style={{ color: t.footerAccent }}>by Shir</span>
      </span>
      <span style={{ fontFamily: t.body, fontSize: 13, color: t.footerFg, opacity: 0.4 }}>Balloon decorations · Algarve, Portugal</span>
    </footer>);

}

// ─── TWEAKS PANEL ─────────────────────────────────────────────────────────────
function TweaksPanel({ theme, setTheme, visible }) {
  if (!visible) return null;
  return (
    <div style={{ position: "fixed", bottom: 24, right: 24, background: "white", borderRadius: 16, padding: 24, boxShadow: "0 8px 40px rgba(0,0,0,0.18)", zIndex: 9999, width: 280 }}>
      <p style={{ fontFamily: "system-ui", fontWeight: 700, fontSize: 13, marginBottom: 16, letterSpacing: 0.5 }}>Tweaks</p>
      <p style={{ fontFamily: "system-ui", fontSize: 11, fontWeight: 600, letterSpacing: 2, textTransform: "uppercase", opacity: 0.4, marginBottom: 12 }}>Design Direction</p>
      {Object.entries(THEMES).map(([key, th]) =>
      <button key={key} onClick={() => {
        setTheme(key);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: key } }, '*');
      }} style={{ width: "100%", textAlign: "left", padding: "12px 14px", marginBottom: 8, borderRadius: 10, border: theme === key ? `2px solid ${th.accent1}` : "2px solid rgba(0,0,0,0.08)", background: theme === key ? `${th.accent1}14` : "transparent", cursor: "pointer", fontFamily: "system-ui", fontSize: 14, fontWeight: theme === key ? 700 : 400 }}>
          <span style={{ display: "block", fontWeight: 700, color: th.accent1, fontSize: 12, letterSpacing: 1, textTransform: "uppercase", marginBottom: 2 }}>{key}</span>
          {th.name}
        </button>
      )}
    </div>);

}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState(TWEAK_DEFAULTS.theme || "A");
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [quote, setQuote] = useState(150);
  const [calcSel, setCalcSel] = useState({ pkg: "arch", flowers: "no", numbers: "no", location: "local" });

  useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const t = THEMES[theme];

  return (
    <div style={{ fontFamily: t.body }}>
      <Nav t={t} />
      <Hero t={t} />
      <Stats t={t} />
      <Gallery t={t} />
      <About t={t} />
      <Calculator t={t} onQuoteChange={setQuote} onSelChange={setCalcSel} />
      <Instagram t={t} />
      <FAQ t={t} />
      <Booking t={t} quote={quote} calcSel={calcSel} />
      <Footer t={t} />
      <TweaksPanel theme={theme} setTheme={setTheme} visible={tweaksVisible} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
